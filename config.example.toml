# NYX Client configuration example
# Copy to ~/.config/nyx/config.toml

[network]
default_server = "nyx://relay1.nyx.network"
max_relays = 5
connection_timeout = 10
# bootstrap_servers = ["nyx://relay2.example.com", "nyx://relay3.example.com"]

[security]
require_verified_relay = true
min_trust_level = 1
pin_tls_certificates = true

[updates]
auto_check = true
check_interval_hours = 24
auto_install = false
channel = "stable"
# github_manifest_url = "https://raw.githubusercontent.com/YOUR_ORG/nyx/main/manifest.json"
# release_keys_file = "~/.config/nyx/release_keys.json"

[logging]
level = "INFO"
json_logs = false

[privacy]
send_read_receipts = false
share_online_status = false
