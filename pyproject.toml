[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nyx-client"
version = "0.2.0"
description = "NYX Terminal-Native Distributed Communication Protocol — Python Client (MVP)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Open Source" }
authors = [
    { name = "Mr.A" }
]
keywords = [
    "nyx",
    "messaging",
    "e2ee",
    "terminal",
    "privacy",
    "cryptography",
    "distributed",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.9.0",
    "pynacl>=1.5.0",
    "cryptography>=42.0.0",
    "textual>=0.80.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "sqlcipher3>=0.5.0; platform_system != 'Windows'",
    "msgpack>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0",
    "blake3>=0.4.0",
    "bech32>=1.2.0",
    "mnemonic>=0.21",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-aiohttp",
]

[project.scripts]
nyx = "nyx_client.main:main"

[tool.hatch.build.targets.wheel]
packages = ["nyx_client"]

[tool.hatch.build.targets.sdist]
include = [
    "/nyx_client",
    "/README.md",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["nyx_client"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
