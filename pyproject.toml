[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nyx-client"
version = "0.0.6"
description = "NYX Secure Terminal-Native Communication Client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.40.0",
    "cryptography>=41.0.0",
    "rich>=13.0.0"
]