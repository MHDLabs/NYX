[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nyx-client"
version = "0.0.6"
description = "NYX Secure Terminal-Native Communication Client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.40.0",
    "cryptography>=41.0.0",
    "rich>=13.0.0",
    "pynacl>=1.5.0",
    "aiosqlite>=0.19.0",
    "requests>=2.31.0",
    "prompt-toolkit>=3.0.43",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.1",
    "python-dateutil>=2.8.2",
    "structlog>=24.1.0",
    "bech32>=1.2.0"
]
